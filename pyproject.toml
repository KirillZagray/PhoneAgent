[project]
name = "phoneagent"
version = "0.1.0"
description = "Универсальный микросервис для автоматизации телефонных записей с AI-ассистентом"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kirill Zagray" }]
keywords = ["voice-agent", "booking", "telephony", "ai-assistant", "voximplant", "salon"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "python-multipart>=0.0.12",
    "tenacity>=9.0.0",
    "edge-tts>=6.1.0",
    "anthropic>=0.39.0",
    "openai>=1.55.0",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
]

[project.scripts]
phoneagent = "phoneagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phoneagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
