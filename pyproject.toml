[project]
name = "phoneagent"
version = "0.2.0"
description = "Микросервис для автоматизации телефонных записей с AI-ассистентом"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kirill Zagray" }]
keywords = ["voice-agent", "booking", "telephony", "ai-assistant", "voximplant", "salon"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    # ARI events (AsteriskTelephonyProvider) — не тянем через uvicorn[standard]
    # транзитивно, чтобы явно заявленная версия не съехала при апгрейде uvicorn.
    "websockets>=13.0",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "tenacity>=9.0.0",
    "edge-tts>=6.1.0",
    "anthropic>=0.39.0",
    "openai>=1.55.0",
    "pyyaml>=6.0",
    # audioop убран из stdlib в 3.13 — тот же модуль из PyPI
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.optional-dependencies]
# Локальный Whisper тянет ctranslate2/numpy (сотни МБ). Тем, кто на VoiceStudio
# или whisper_api, он не нужен: `uv sync --extra local-stt`.
local-stt = ["faster-whisper>=1.0.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
    "fakeredis>=2.26.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
phoneagent = "phoneagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phoneagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ponytail: DTZ (naive datetime.now()) и PYI034/036 (Self/exit-annotation stubs)
# — pre-existing паттерн по всему проекту (ConversationState/Message timestamps),
# не связаны с багами этого прохода. Апгрейд — отдельный проход на tz-aware
# datetime везде разом, а не точечно в паре файлов.
ignore = ["DTZ001", "DTZ005", "PYI034", "PYI036"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # audioop deprecated в 3.11-3.12, в 3.13 берётся из audioop-lts — предупреждение ожидаемое
    "ignore:'audioop' is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# Опциональные / без стабов
module = ["faster_whisper", "faster_whisper.*", "numpy", "edge_tts", "edge_tts.*", "audioop"]
ignore_missing_imports = true
