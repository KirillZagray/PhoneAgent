; Диапазон RTP-портов сужен до того, что реально опубликовано наружу в
; docker-compose.yml (10000-10010/udp). Дефолт образа — 10000-20000: Asterisk
; выбирает порт для звонка случайно из всего диапазона, и почти всегда он
; не совпадает с опубликованными портами — Docker просто не форвардит
; входящий RTP на неопубликованный порт. Итог на практике: исходящее аудио
; работает (исходящий UDP не требует публикации порта), а входящее (голос
; собеседника) до контейнера не доходит вообще. См. отладку 2026-09-10.
;
; 10000-10010 — 11 портов, этого достаточно для нескольких одновременных
; тестовых звонков. Расширять вместе с ports: в docker-compose.yml, если
; понадобится больше параллельных звонков.

[general]
rtpstart=10000
rtpend=10010
