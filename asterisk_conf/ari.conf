; ARI (Asterisk REST Interface) — control plane для AsteriskTelephonyProvider.
;
; REPLACE_ARI_PASSWORD — плейсхолдер, не коммитим реальный секрет в git
; (см. asterisk_conf/pjsip.conf — тот же принцип для MTS-креденшлов).
; Сгенерировать: openssl rand -hex 24 — и вписать то же значение сюда и в
; ASTERISK_ARI_PASSWORD в .env PhoneAgent на сервере.

[general]
enabled = yes
pretty = yes
allowed_origins = *

[phoneagent]
type = user
read_only = no
password = REPLACE_ARI_PASSWORD
