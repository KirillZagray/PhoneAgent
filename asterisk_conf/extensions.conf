; Dialplan для Phase A (echo-тест транспорта).
;
; AsteriskTelephonyProvider.make_call сразу отправляет канал в Stasis-приложение
; (см. ASTERISK_STASIS_APP=phoneagent_bridge). На StasisStart наш Python-код
; переводит канал сюда через ARI /channels/{id}/continue — то есть в этот
; контекст канал попадает не через обычный номерной план, а по явной команде.
;
; PHONEAGENT_CALL_ID — channel-переменная, которую make_call проставляет при
; Originate; AudioSocket() использует её как UUID для хендшейка с нашим
; TCP-мостом (см. phoneagent/api/audiosocket_server.py).

[phoneagent-bridge]
exten => s,1,NoOp(PhoneAgent AudioSocket bridge, call_id=${PHONEAGENT_CALL_ID})
 same => n,Answer()
 same => n,AudioSocket(${PHONEAGENT_CALL_ID},phoneagent:40122)
 same => n,Hangup()
