; SIP-транспорт и SIP-ID транк MTS Exolve.
;
; REPLACE_MTS_* — плейсхолдеры, ждут реальных значений из кабинета MTS Exolve
; (SIP-ID username/password и registrar host). До их подстановки транк не
; зарегистрируется — это ожидаемо, остальной стек (ARI/AudioSocket) от этого
; не зависит и тестируется независимо.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Публичный IP сервера — чтобы SDP/Via снаружи показывали адрес, на который
; реально можно ответить, а не внутренний Docker-IP.
external_media_address=88.218.248.208
external_signaling_address=88.218.248.208

[mts_exolve-auth]
type=auth
auth_type=userpass
username=REPLACE_MTS_SIP_USERNAME
password=REPLACE_MTS_SIP_PASSWORD

[mts_exolve-aor]
type=aor
contact=sip:REPLACE_MTS_REGISTRAR_HOST
qualify_frequency=60

[mts_exolve-reg]
type=registration
outbound_auth=mts_exolve-auth
server_uri=sip:REPLACE_MTS_REGISTRAR_HOST
client_uri=sip:REPLACE_MTS_SIP_USERNAME@REPLACE_MTS_REGISTRAR_HOST
retry_interval=60

[mts_exolve]
type=endpoint
transport=transport-udp
context=phoneagent-bridge
disallow=all
allow=ulaw
allow=alaw
outbound_auth=mts_exolve-auth
aors=mts_exolve-aor
from_user=REPLACE_MTS_SIP_USERNAME
