services:
  phoneagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phoneagent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    # environment: имеет приоритет над env_file — эти значения нельзя случайно
    # перебить .env'ом (например, STATE_STORE=memory из .env.example).
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STATE_STORE: redis
      REDIS_URL: redis://redis:6379/0
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-mock}
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      TTS_PROVIDER: ${TTS_PROVIDER:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      BOOKING_CONNECTOR: ${BOOKING_CONNECTOR:-mock}
      # В production контейнер не стартует без этих двух (см. main.lifespan):
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - phoneagent-net

  asterisk:
    image: andrius/asterisk:20
    container_name: phoneagent-asterisk
    restart: unless-stopped
    volumes:
      - ./asterisk_conf/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk_conf/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk_conf/ari.conf:/etc/asterisk/ari.conf:ro
      - ./asterisk_conf/http.conf:/etc/asterisk/http.conf:ro
    ports:
      # SIP-сигналинг и RTP наружу — транк регистрируется исходящим REGISTER,
      # но ответный трафик (и будущие входящие) должны достучаться до нас.
      - "5060:5060/udp"
      - "10000-10010:10000-10010/udp"
    depends_on:
      - phoneagent
    networks:
      - phoneagent-net

  redis:
    image: redis:7-alpine
    container_name: phoneagent-redis
    restart: unless-stopped
    # Наружу не публикуем: доступ только внутри compose-сети. Для отладки с хоста —
    # `docker exec -it phoneagent-redis redis-cli`.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - phoneagent-net

volumes:
  redis-data:

networks:
  phoneagent-net:
    driver: bridge
